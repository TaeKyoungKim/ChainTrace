<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ChainTrace - 제조사 완제품 무역원장 포탈</title>
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #090d16;
      --card-bg: #121929;
      --accent-violet: #a855f7;
      --accent-red: #ff4757;
      --accent-green: #2ed573;
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --border-color: #1e293b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Pretendard', sans-serif; }
    body { background-color: var(--bg-dark); color: var(--text-main); padding: 2rem; }

    .header {
      display: flex; justify-content: space-between; align-items: center;
      padding-bottom: 1.5rem; border-bottom: 1px solid var(--border-color); margin-bottom: 2rem;
    }
    .header h1 { font-size: 1.8rem; font-weight: 700; color: var(--accent-violet); display: flex; align-items: center; gap: 0.5rem; }
    .header .subtitle { color: var(--text-muted); font-size: 0.9rem; margin-top: 0.3rem; }

    .grid-layout { display: grid; grid-template-columns: 1fr 1fr; gap: 2rem; }
    @media (max-width: 1024px) { .grid-layout { grid-template-columns: 1fr; } }

    .card {
      background: var(--card-bg); border: 1px solid var(--border-color);
      border-radius: 12px; padding: 1.5rem; box-shadow: 0 8px 24px rgba(0,0,0,0.3); margin-bottom: 2rem;
    }
    .card-title { font-size: 1.2rem; font-weight: 600; margin-bottom: 1.2rem; display: flex; align-items: center; gap: 0.5rem; color: #fff; }

    .form-group { margin-bottom: 1.2rem; }
    .form-group label { display: block; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 0.4rem; }
    .form-control {
      width: 100%; padding: 0.75rem 1rem; background: #070a12; border: 1px solid var(--border-color);
      border-radius: 8px; color: var(--text-main); font-size: 0.95rem; outline: none; transition: border 0.2s;
    }
    .form-control:focus { border-color: var(--accent-violet); }

    .btn-submit {
      width: 100%; padding: 0.9rem; background: linear-gradient(135deg, #a855f7, #6366f1);
      border: none; border-radius: 8px; color: #fff; font-weight: 700; font-size: 1rem; cursor: pointer;
      box-shadow: 0 4px 15px rgba(168, 85, 247, 0.4); transition: transform 0.1s, box-shadow 0.2s;
    }
    .btn-submit:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(168, 85, 247, 0.6); }

    .btn-recall {
      padding: 0.4rem 0.8rem; background: var(--accent-red); border: none; border-radius: 6px;
      color: #fff; font-weight: 600; font-size: 0.75rem; cursor: pointer;
    }
    .btn-recall:hover { background: #ff6b81; }

    .raw-item {
      display: flex; align-items: center; justify-content: space-between; padding: 0.75rem;
      border: 1px solid var(--border-color); border-radius: 8px; margin-bottom: 0.5rem; background: #070a12;
    }
    .raw-item.disabled { opacity: 0.5; border-color: var(--accent-red); background: rgba(255,71,87,0.05); }

    .badge-status {
      padding: 0.2rem 0.5rem; border-radius: 4px; font-size: 0.75rem; font-weight: 600;
    }
    .badge-normal { background: rgba(46,213,115,0.15); color: var(--accent-green); border: 1px solid var(--accent-green); }
    .badge-recalled { background: rgba(255,71,87,0.2); color: var(--accent-red); border: 1px solid var(--accent-red); }

    .cert-card {
      background: linear-gradient(135deg, #1d1233, #0f0a1c); border: 1px solid var(--accent-violet);
      border-radius: 12px; padding: 1.5rem; margin-top: 1.5rem; display: none;
    }
    .cert-card.active { display: block; animation: fadeIn 0.4s ease-out; }
    .cert-row { display: flex; justify-content: space-between; margin-bottom: 0.6rem; font-size: 0.9rem; }
    .cert-row .label { color: var(--text-muted); }
    .cert-row .val { font-weight: 600; text-align: right; word-break: break-all; }

    table { width: 100%; border-collapse: collapse; margin-top: 1rem; font-size: 0.85rem; }
    th, td { padding: 0.75rem; text-align: left; border-bottom: 1px solid var(--border-color); }
    th { color: var(--text-muted); background: #070a12; }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body>

  <div class="header">
    <div>
      <h1>🏭 ChainTrace 제조사 완제품 무역원장 포탈</h1>
      <div class="subtitle">상위 원료 계보(Genealogy) 연결 완제품 생산 및 온체인 무역원장 서명 / 자사 결함 리콜 제어</div>
    </div>
    <div>
      <label style="font-size:0.8rem; color:var(--text-muted);">접속 제조사 선택:</label>
      <select id="manufacturerSelect" class="form-control" style="width:250px; margin-top:0.3rem;" onchange="loadManufacturerBatches()">
        <option value="0x3C44CdDdB6a900fa2b585dd299e03d12FA4293BC">(주)한국홍삼제조</option>
        <option value="0x90F79bf6EB2c4f870365E785982E1f101E93b906">한독바이오제약</option>
        <option value="0x15d34AAf54267DB7D7c367839AAf71A00a2C6A65">CJ웰케어제조센터</option>
      </select>
    </div>
  </div>

  <div class="grid-layout">
    <!-- 왼쪽: 완제품 제조 무역원장 폼 및 원료 계보 선택 -->
    <div>
      <div class="card">
        <div class="card-title">📝 완제품 제조 및 원료 계보(Genealogy) 수록</div>
        <form id="mfgForm" onsubmit="handleFormSubmit(event)">

          <div class="form-group">
            <label>1. 투입할 상위 원료 배치 선택 (Parent Raw Batches)</label>
            <div id="rawBatchesList" style="max-height:180px; overflow-y:auto; padding-right:0.3rem;">
              <div style="color:var(--text-muted); font-size:0.85rem;">원료 목록 로딩 중...</div>
            </div>
          </div>

          <div class="form-group">
            <label>완제품 배치 ID (Batch ID)</label>
            <div style="display:flex; gap:0.5rem;">
              <input type="text" id="batchId" class="form-control" placeholder="MFG-EXTRACT-20260811-001" required>
              <button type="button" class="form-control" style="width:auto; cursor:pointer;" onclick="generateAutoBatchId()">⚡ 자동생성</button>
            </div>
          </div>

          <div class="form-group">
            <label>완제품 품목명 (Product Name)</label>
            <input type="text" id="productName" class="form-control" value="6년근 프리미엄 홍삼정 스틱 30포" required>
          </div>

          <div style="display:flex; gap:1rem;">
            <div class="form-group" style="flex:1;">
              <label>생산 수량 (Quantity)</label>
              <input type="number" id="quantity" class="form-control" value="500" required>
            </div>
            <div class="form-group" style="flex:1;">
              <label>단위 (Unit)</label>
              <input type="text" id="unit" class="form-control" value="box" required>
            </div>
          </div>

          <div class="form-group">
            <label>제조 공정 메타데이터 (Metadata Hash / IPFS)</label>
            <input type="text" id="metadataHash" class="form-control" value="ipfs://QmManufacturedSpec_20260811" required>
          </div>

          <button type="submit" class="btn-submit" id="btnSubmit">🖊️ 완제품 무역원장 전자서명 및 계보 연결</button>
        </form>

        <!-- 무역원장 전자증명서 카드 -->
        <div id="certCard" class="cert-card">
          <div class="badge-status badge-normal" style="margin-bottom:1rem;">CONFIRMED ON CHAIN</div>
          <h3 style="font-size:1.1rem; color:var(--accent-violet); margin-bottom:1rem;">📜 완제품 계보 무역원장 전자증명서</h3>
          <div class="cert-row"><span class="label">완제품 배치 ID:</span><span class="val" id="certBatchId"></span></div>
          <div class="cert-row"><span class="label">완제품명:</span><span class="val" id="certProduct"></span></div>
          <div class="cert-row"><span class="label">연결 원료 계보:</span><span class="val" id="certParents" style="color:var(--accent-violet);"></span></div>
          <div class="cert-row"><span class="label">생산 수량:</span><span class="val" id="certQty"></span></div>
          <div class="cert-row"><span class="label">서명 제조사:</span><span class="val" id="certManufacturer" style="font-size:0.75rem;"></span></div>
          <div class="cert-row"><span class="label">트랜잭션 해시:</span><span class="val" id="certTxHash" style="font-size:0.7rem; color:var(--accent-violet);"></span></div>
        </div>
      </div>
    </div>

    <!-- 오른쪽: 자사 제조 배치 목록 및 결함 발생 시 리콜 발령 제어 -->
    <div>
      <div class="card">
        <div class="card-title">📦 자사 제조 완제품 목록 및 자발적 리콜 관리</div>
        <table>
          <thead>
            <tr>
              <th>배치 ID</th>
              <th>완제품명</th>
              <th>상위 원료</th>
              <th>상태 / 리콜 제어</th>
            </tr>
          </thead>
          <tbody id="mfgBatchesTableBody">
            <tr><td colspan="4" style="color:var(--text-muted); text-align:center;">로딩 중...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    function generateAutoBatchId() {
      const rand = Math.floor(Math.random() * 1000).toString().padStart(3, '0');
      document.getElementById('batchId').value = `MFG-EXT-${new Date().toISOString().slice(0,10).replace(/-/g,'')}-${rand}`;
    }

    async function loadRawBatches() {
      const res = await fetch('/api/manufacturer/raw-batches');
      const data = await res.json();
      const container = document.getElementById('rawBatchesList');

      if (data.success && data.rawBatches.length > 0) {
        container.innerHTML = data.rawBatches.map(r => {
          const isUsable = r.isUsable;
          const badgeClass = isUsable ? 'badge-normal' : 'badge-recalled';
          const badgeText = isUsable ? 'NORMAL (사용 가능)' : `🚨 ${r.status} (사용 불가)`;

          return `
            <div class="raw-item ${isUsable ? '' : 'disabled'}">
              <label style="display:flex; align-items:center; gap:0.5rem; cursor:${isUsable ? 'pointer' : 'not-allowed'}; font-size:0.85rem;">
                <input type="checkbox" name="parentRaw" value="${r.batchId}" ${isUsable ? '' : 'disabled'}>
                <strong>${r.batchId}</strong> - ${r.productName}
              </label>
              <span class="badge-status ${badgeClass}">${badgeText}</span>
            </div>
          `;
        }).join('');
      } else {
        container.innerHTML = '<div style="color:var(--text-muted);">투입 가능한 원료가 없습니다.</div>';
      }
    }

    async function loadManufacturerBatches() {
      const mfgAddr = document.getElementById('manufacturerSelect').value;
      const res = await fetch(`/api/manufacturer/batches/${mfgAddr}`);
      const data = await res.json();
      
      const tbody = document.getElementById('mfgBatchesTableBody');
      if (data.success && data.batches.length > 0) {
        tbody.innerHTML = data.batches.map(b => `
          <tr>
            <td style="font-weight:600; color:var(--accent-violet);">${b.batch_id}</td>
            <td>${b.product_name}</td>
            <td style="font-size:0.75rem; color:var(--text-muted);">${(b.parentBatchIds || []).join(', ')}</td>
            <td>
              ${b.isRecalled ? 
                '<span class="badge-status badge-recalled">RECALLED</span>' : 
                `<button type="button" class="btn-recall" onclick="triggerSelfRecall('${b.batch_id}')">🚨 리콜 발령</button>`
              }
            </td>
          </tr>
        `).join('');
      } else {
        tbody.innerHTML = '<tr><td colspan="4" style="color:var(--text-muted); text-align:center;">제조된 완제품이 없습니다.</td></tr>';
      }
    }

    async function handleFormSubmit(e) {
      e.preventDefault();
      
      const selectedParents = Array.from(document.querySelectorAll('input[name="parentRaw"]:checked')).map(cb => cb.value);
      if (selectedParents.length === 0) {
        alert('⚠️ 완제품 제조에 투입할 상위 원료 배치를 최소 1개 이상 선택해 주세요!');
        return;
      }

      const btn = document.getElementById('btnSubmit');
      btn.innerText = "⏳ 온체인 서명 및 계보 연결 기록 중...";
      btn.disabled = true;

      const payload = {
        manufacturerAddress: document.getElementById('manufacturerSelect').value,
        batchId: document.getElementById('batchId').value,
        productName: document.getElementById('productName').value,
        quantity: document.getElementById('quantity').value,
        unit: document.getElementById('unit').value,
        parentBatchIds: selectedParents,
        metadataHash: document.getElementById('metadataHash').value
      };

      try {
        const res = await fetch('/api/manufacturer/create-batch', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const data = await res.json();
        if (data.success) {
          const c = data.certificate;
          document.getElementById('certBatchId').innerText = c.batchId;
          document.getElementById('certProduct').innerText = c.productName;
          document.getElementById('certParents').innerText = c.parentBatchIds.join(', ');
          document.getElementById('certQty').innerText = c.quantity;
          document.getElementById('certManufacturer').innerText = c.manufacturerAddress;
          document.getElementById('certTxHash').innerText = c.transactionHash;
          document.getElementById('certCard').classList.add('active');

          loadManufacturerBatches();
          loadRawBatches();
        } else {
          alert('등록 실패: ' + data.message);
        }
      } catch (err) {
        alert('오류 발생: ' + err.message);
      } finally {
        btn.innerText = "🖊️ 완제품 무역원장 전자서명 및 계보 연결";
        btn.disabled = false;
      }
    }

    async function triggerSelfRecall(batchId) {
      const reason = prompt(`[${batchId}] 배치를 온체인 리콜 발령하시겠습니까?\n리콜 사유를 입력하세요:`, '제조 용기 결함 가능성으로 인한 자발적 온체인 리콜');
      if (!reason) return;

      try {
        const res = await fetch('/api/manufacturer/trigger-recall', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            manufacturerAddress: document.getElementById('manufacturerSelect').value,
            batchId,
            reason
          })
        });

        const data = await res.json();
        if (data.success) {
          alert(`🚨 온체인 리콜 발령 완료!\n- 배치 ID: ${batchId}\n- 사유: ${reason}`);
          loadManufacturerBatches();
          loadRawBatches();
        } else {
          alert('리콜 발령 실패: ' + data.message);
        }
      } catch (err) {
        alert('오류 발생: ' + err.message);
      }
    }

    window.onload = () => {
      generateAutoBatchId();
      loadRawBatches();
      loadManufacturerBatches();
    };
  </script>
</body>
</html>
